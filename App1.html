<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App 1 · Trayectorias Térmicas</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { font-family: 'Inter', system-ui, sans-serif; }
  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  input[type=range]{ accent-color:#0ea5e9; }
  .therm-fill{ transition: height .25s ease, background .25s ease; }
  .glass{ background:rgba(255,255,255,.85); backdrop-filter:blur(6px); }
</style>
</head>
<body class="bg-gradient-to-br from-slate-100 to-slate-200 text-slate-800 min-h-screen">

<div class="p-3 sm:p-4 max-w-[1500px] mx-auto">

  <!-- cabecera -->
  <header class="flex items-center gap-3 mb-3">
    <div class="text-3xl">🌡️</div>
    <div>
      <h1 class="text-lg sm:text-xl font-extrabold text-slate-900 leading-tight">Trayectorias Térmicas</h1>
      <p class="text-xs text-slate-500">Define cómo evoluciona la temperatura de cada componente durante un ciclo de repostaje.</p>
    </div>
  </header>

  <!-- horizonte -->
  <div class="glass rounded-xl border border-slate-200 p-3 mb-3 flex flex-wrap items-center gap-x-6 gap-y-2">
    <label class="flex items-center gap-3 text-sm font-medium text-slate-700">
      Duración del ciclo
      <input id="K" type="range" min="30" max="150" step="5" value="60" class="w-40">
      <span id="K-val" class="font-bold text-sky-600 w-12">60 s</span>
    </label>
    <label class="flex items-center gap-3 text-sm font-medium text-slate-700 ml-auto">
      ⏱️ Instante
      <input id="scrub" type="range" min="0" max="60" step="1" value="30" class="w-44">
      <span id="scrub-val" class="font-bold text-slate-700 w-10">30s</span>
    </label>
    <button id="play" class="px-3 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-700 text-white text-sm font-semibold">▶ Reproducir</button>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
    <!-- controles -->
    <section id="cards" class="flex flex-col gap-3"></section>

    <!-- visualización -->
    <section class="flex flex-col gap-3">
      <!-- termómetros -->
      <div class="glass rounded-xl border border-slate-200 p-3">
        <h3 class="text-sm font-bold text-slate-700 mb-2">Estado instantáneo</h3>
        <div id="therms" class="grid grid-cols-4 gap-2"></div>
      </div>
      <!-- chart temperatura -->
      <div class="glass rounded-xl border border-slate-200 p-3">
        <h3 class="text-sm font-bold text-slate-700 mb-1">Temperatura vs tiempo (°C)</h3>
        <div class="relative h-44 sm:h-52"><canvas id="ch-temp"></canvas></div>
      </div>
      <!-- chart calor -->
      <div class="glass rounded-xl border border-slate-200 p-3">
        <h3 class="text-sm font-bold text-slate-700 mb-1">Carga térmica Q = m·Cp·dT/dt (kW)</h3>
        <p class="text-[11px] text-slate-400 mb-1">Positivo = absorbe calor · Negativo = libera calor</p>
        <div class="relative h-40 sm:h-48"><canvas id="ch-heat"></canvas></div>
      </div>
    </section>
  </div>
</div>

<script src="core/bus.js"></script>
<script>
let cfg = Thermal.defaultApp1Config();
let result = null, scrub = 30, playing = false, playTimer = null;
let chTemp = null, chHeat = null;

// ---------- UI controles ----------
function buildCards(){
  const wrap = document.getElementById('cards');
  wrap.innerHTML = '';
  cfg.streams.forEach((s, i) => {
    const isHot = s.role === 'hot';
    const card = document.createElement('div');
    card.className = 'glass rounded-xl border border-slate-200 p-3';
    card.style.borderLeft = `5px solid ${s.color}`;
    card.innerHTML = `
      <div class="flex items-center justify-between mb-2">
        <h4 class="font-bold text-slate-800 flex items-center gap-2"><span class="text-xl">${s.icon}</span>${s.name}</h4>
        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${isHot?'bg-red-100 text-red-700':'bg-sky-100 text-sky-700'}">
          ${isHot?'FOCO CALIENTE':'DEMANDA FRÍA'}
        </span>
      </div>
      <div class="grid grid-cols-2 gap-x-3 gap-y-2 text-xs">
        <label class="block">Perfil
          <select data-i="${i}" data-f="profile" class="w-full mt-0.5 border border-slate-300 rounded px-1.5 py-1">
            <option value="linear" ${s.profile==='linear'?'selected':''}>Rampa lineal</option>
            <option value="exp" ${s.profile==='exp'?'selected':''}>Exponencial</option>
            <option value="smooth" ${s.profile==='smooth'?'selected':''}>Curva suave (S)</option>
            <option value="sin" ${s.profile==='sin'?'selected':''}>Oscilante</option>
          </select>
        </label>
        <div></div>
        <label class="block">T inicial <b data-d="T_init-${i}" class="float-right text-slate-700">${s.T_init}°C</b>
          <input type="range" data-i="${i}" data-f="T_init" min="-50" max="150" step="1" value="${s.T_init}" class="w-full">
        </label>
        <label class="block">T final <b data-d="T_final-${i}" class="float-right text-slate-700">${s.T_final}°C</b>
          <input type="range" data-i="${i}" data-f="T_final" min="-50" max="150" step="1" value="${s.T_final}" class="w-full">
        </label>
        <label class="block col-span-2">Capacidad térmica m·Cp <b data-d="mCp-${i}" class="float-right text-slate-700">${(s.mCp/1000).toFixed(0)} kJ/K</b>
          <input type="range" data-i="${i}" data-f="mCp" min="5000" max="100000" step="1000" value="${s.mCp}" class="w-full">
        </label>
        <label class="block sin-${i} ${s.profile==='sin'?'':'hidden'}">Amplitud <b data-d="amp-${i}" class="float-right text-slate-700">${s.amp} K</b>
          <input type="range" data-i="${i}" data-f="amp" min="0" max="20" step="1" value="${s.amp}" class="w-full">
        </label>
        <label class="block sin-${i} ${s.profile==='sin'?'':'hidden'}">Frecuencia <b data-d="freq-${i}" class="float-right text-slate-700">${s.freq}</b>
          <input type="range" data-i="${i}" data-f="freq" min="0.01" max="0.2" step="0.01" value="${s.freq}" class="w-full">
        </label>
      </div>`;
    wrap.appendChild(card);
  });

  wrap.querySelectorAll('input,select').forEach(el => {
    el.addEventListener('input', () => {
      const i = +el.dataset.i, f = el.dataset.f;
      cfg.streams[i][f] = (f === 'profile') ? el.value : parseFloat(el.value);
      const d = document.querySelector(`[data-d="${f}-${i}"]`);
      if (d) {
        if (f === 'mCp') d.textContent = (cfg.streams[i].mCp/1000).toFixed(0) + ' kJ/K';
        else if (f === 'amp') d.textContent = cfg.streams[i].amp + ' K';
        else if (f === 'freq') d.textContent = cfg.streams[i].freq;
        else d.textContent = el.value + '°C';
      }
      if (f === 'profile') {
        document.querySelectorAll('.sin-'+i).forEach(n => n.classList.toggle('hidden', el.value !== 'sin'));
      }
      recompute();
    });
  });
}

// ---------- termómetros ----------
function buildTherms(){
  const w = document.getElementById('therms');
  w.innerHTML = cfg.streams.map(s => `
    <div class="flex flex-col items-center">
      <div class="relative w-7 h-28 bg-slate-200 rounded-full overflow-hidden border border-slate-300">
        <div id="tf-${s.id}" class="therm-fill absolute bottom-0 left-0 w-full" style="height:0%"></div>
      </div>
      <div class="text-xl mt-1">${s.icon}</div>
      <div id="tt-${s.id}" class="text-xs font-bold text-slate-700">--</div>
    </div>`).join('');
}
function updateTherms(){
  if (!result) return;
  const k = Math.min(scrub, result.K);
  result.streams.forEach(s => {
    const t = s.T[k];
    const pct = Math.max(2, Math.min(100, (t + 50) / 200 * 100));
    const fill = document.getElementById('tf-'+s.id);
    const lab = document.getElementById('tt-'+s.id);
    if (fill){ fill.style.height = pct + '%'; fill.style.background = Thermal.colorForTemp(t); }
    if (lab) lab.textContent = t.toFixed(0) + '°C';
  });
}

// ---------- charts ----------
const scrubLine = {
  id: 'scrubLine',
  afterDraw(chart){
    const x = chart.scales.x.getPixelForValue(scrub);
    const { top, bottom } = chart.chartArea;
    const ctx = chart.ctx;
    ctx.save();
    ctx.strokeStyle = 'rgba(15,23,42,.45)';
    ctx.lineWidth = 1.5; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bottom); ctx.stroke();
    ctx.restore();
  }
};
function baseOpts(yLabel){
  return {
    responsive:true, maintainAspectRatio:false, animation:false,
    interaction:{ mode:'index', intersect:false },
    plugins:{ legend:{ position:'top', labels:{ usePointStyle:true, boxWidth:7, font:{size:10} } } },
    scales:{
      x:{ title:{ display:true, text:'Tiempo (s)', font:{size:10} }, ticks:{ maxTicksLimit:8, font:{size:9} }, grid:{ color:'#eef2f7' } },
      y:{ title:{ display:true, text:yLabel, font:{size:10} }, ticks:{ font:{size:9} }, grid:{ color:'#eef2f7' } }
    }
  };
}
function initCharts(){
  chTemp = new Chart(document.getElementById('ch-temp'), { type:'line', data:{labels:[],datasets:[]}, options:baseOpts('°C'), plugins:[scrubLine] });
  chHeat = new Chart(document.getElementById('ch-heat'), { type:'line', data:{labels:[],datasets:[]}, options:baseOpts('kW'), plugins:[scrubLine] });
}
function updateCharts(){
  const labels = result.time;
  chTemp.data.labels = labels;
  chTemp.data.datasets = result.streams.map(s => ({
    label:s.name, data:s.T, borderColor:s.color, backgroundColor:s.color+'22',
    borderWidth:2, pointRadius:0, tension:.25, fill:false
  }));
  chTemp.update();
  chHeat.data.labels = labels;
  chHeat.data.datasets = result.streams.map(s => ({
    label:s.name, data:s.Q.map(q=>q/1000), borderColor:s.color, backgroundColor:s.color+'22',
    borderWidth:2, pointRadius:0, tension:.2, fill:true
  }));
  chHeat.update();
}

// ---------- recompute + publish ----------
function recompute(){
  result = Thermal.computeApp1(cfg);
  updateCharts();
  updateTherms();
  Thermal.publish(result);
}

// ---------- play ----------
function togglePlay(){
  playing = !playing;
  document.getElementById('play').textContent = playing ? '⏸ Pausa' : '▶ Reproducir';
  if (playing){
    playTimer = setInterval(() => {
      scrub = (scrub + 1) % (cfg.K + 1);
      syncScrub();
    }, 80);
  } else clearInterval(playTimer);
}
function syncScrub(){
  document.getElementById('scrub').value = scrub;
  document.getElementById('scrub-val').textContent = scrub + 's';
  updateTherms();
  if (chTemp) chTemp.draw();
  if (chHeat) chHeat.draw();
}

// ---------- init ----------
document.getElementById('K').addEventListener('input', e => {
  cfg.K = +e.target.value;
  document.getElementById('K-val').textContent = cfg.K + ' s';
  const sc = document.getElementById('scrub');
  sc.max = cfg.K; if (scrub > cfg.K) scrub = cfg.K;
  recompute(); syncScrub();
});
document.getElementById('scrub').addEventListener('input', e => { scrub = +e.target.value; syncScrub(); });
document.getElementById('play').addEventListener('click', togglePlay);

buildCards();
buildTherms();
initCharts();

// el bus puede entregar una configuración previamente guardada
Thermal.initApp('app1', (state) => {
  if (state.app1 && state.app1.streams && !window.__hydrated){
    window.__hydrated = true;
    // re-hidratar controles desde lo guardado (manteniendo orden de STATION)
    const saved = state.app1;
    cfg.K = saved.K || cfg.K;
    saved.streams.forEach(ss => {
      const t = cfg.streams.find(x => x.id === ss.id);
      if (t){ ['profile','T_init','T_final','mCp','amp','freq'].forEach(f => { if (ss[f]!=null) t[f]=ss[f]; }); }
    });
    document.getElementById('K').value = cfg.K;
    document.getElementById('K-val').textContent = cfg.K + ' s';
    document.getElementById('scrub').max = cfg.K;
    buildCards();
  }
});
recompute();
syncScrub();
</script>
</body>
</html>
