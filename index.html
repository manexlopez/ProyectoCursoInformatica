<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentación de Proyecto - Entorno Integrado</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-principal: #fbf9f6;
            --bg-tarjeta: #ffffff;
            --bg-interior: #f5f0e8;
            --texto-principal: #2a2421;
            --texto-secundario: #7a6f6a;
            --borde: #e8e1d7;
            --acento: #b58960;
            --sombra: 0 4px 20px rgba(42, 36, 33, 0.03);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            line-height: 1.5;
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        header {
            border-bottom: 1px solid var(--borde);
            padding-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            flex-wrap: wrap;
        }

        .header-titulo h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: var(--texto-principal);
            line-height: 1.2;
        }

        .header-titulo p {
            color: var(--texto-secundario);
            font-size: 14px;
            margin-top: 4px;
            font-style: italic;
        }

        .header-meta {
            text-align: right;
            font-size: 12px;
            color: var(--texto-secundario);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header-meta span {
            color: var(--acento);
            font-weight: 500;
        }

        .seccion-principal {
            background-color: var(--bg-tarjeta);
            border: 1px solid var(--borde);
            border-radius: 4px;
            padding: 20px;
            box-shadow: var(--sombra);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .titulo-seccion {
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
        }

        .titulo-seccion h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 22px;
            font-weight: 600;
            color: var(--texto-principal);
        }

        .sub-tag {
            font-size: 11px;
            color: var(--acento);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .selector-principal {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .selector-principal label {
            color: var(--texto-secundario);
            font-size: 13px;
        }

        .selector-principal select,
        .boton-enlace {
            border: 1px solid var(--borde);
            background: #fff;
            color: var(--texto-principal);
            padding: 8px 10px;
            font-size: 13px;
            border-radius: 4px;
            text-decoration: none;
        }

        .boton-enlace:hover,
        .selector-principal select:hover {
            border-color: var(--acento);
        }

        .contenedor-iframe-principal {
            width: 100%;
            height: 460px;
            background-color: var(--bg-interior);
            border: 1px solid var(--borde);
            overflow: hidden;
        }

        .iframe-principal {
            width: 100%;
            height: 100%;
            border: none;
        }

        .grid-2x2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .tarjeta-mini-app {
            background-color: var(--bg-tarjeta);
            border: 1px solid var(--borde);
            border-radius: 4px;
            padding: 12px 16px;
            box-shadow: var(--sombra);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .header-mini-app {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .header-mini-app h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 16px;
            font-weight: 600;
        }

        .contenedor-codigo-satelite {
            width: 100%;
            height: 130px;
            background-color: var(--bg-interior);
            border: 1px solid var(--borde);
            overflow: hidden;
        }

        .iframe-satelite {
            width: 100%;
            height: 100%;
            border: none;
        }

        .acciones-satelite {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .acciones-satelite button {
            border: 1px solid var(--borde);
            background: #fff;
            color: var(--texto-principal);
            padding: 6px 8px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .acciones-satelite button:hover {
            border-color: var(--acento);
        }

        footer {
            text-align: center;
            font-size: 11px;
            color: var(--texto-secundario);
            border-top: 1px solid var(--borde);
            padding-top: 15px;
            margin-top: 10px;
        }

        @media (max-width: 850px) {
            .grid-2x2 { grid-template-columns: 1fr; }
            body { padding: 20px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-titulo">
            <h1>Proyecto Integrado de Desarrollo</h1>
            <p>Sustentación Académica de Módulos Web e Interfaz Core</p>
        </div>
        <div class="header-meta">
            Presentación: <span>Ecosistema Digital</span>
        </div>
    </header>

    <main class="seccion-principal">
        <div class="titulo-seccion">
            <h2>Módulo Principal Detallado</h2>
            <span class="sub-tag">— Visualización de Núcleo (Iframe)</span>
        </div>

        <div class="selector-principal">
            <label for="selector-proyecto-principal">Proyecto principal:</label>
            <select id="selector-proyecto-principal"></select>
            <a id="abrir-principal" class="boton-enlace" href="./projects/project-01/" target="_blank" rel="noopener noreferrer">Abrir en pestaña nueva</a>
        </div>

        <div class="contenedor-iframe-principal">
            <iframe class="iframe-principal" id="app-principal" src="./projects/project-01/" title="Proyecto principal"></iframe>
        </div>
    </main>

    <section class="grid-2x2" id="grid-satelites"></section>
    <p id="nota-satelites" class="sub-tag" aria-live="polite"></p>

    <footer>
        <p>Ecosistema Modular. Proyecto Académico Finalizado.</p>
    </footer>

    <script>
        const proyectos = [
            { id: 'project-01', nombre: '01. Proyecto Base', ruta: './projects/project-01/' },
            { id: 'project-02', nombre: '02. Proyecto Satélite', ruta: './projects/project-02/' },
            { id: 'project-03', nombre: '03. Proyecto Satélite', ruta: './projects/project-03/' },
            { id: 'project-04', nombre: '04. Proyecto Satélite', ruta: './projects/project-04/' },
            { id: 'project-05', nombre: '05. Proyecto Satélite', ruta: './projects/project-05/' }
        ];

        const selector = document.getElementById('selector-proyecto-principal');
        const iframePrincipal = document.getElementById('app-principal');
        const enlacePrincipal = document.getElementById('abrir-principal');
        const gridSatelites = document.getElementById('grid-satelites');
        let proyectoPrincipalId = proyectos[0].id;

        function renderSelector() {
            selector.innerHTML = '';
            proyectos.forEach((proyecto) => {
                const option = document.createElement('option');
                option.value = proyecto.id;
                option.textContent = proyecto.nombre;
                selector.appendChild(option);
            });
            selector.value = proyectoPrincipalId;
        }

        function crearTarjetaSatelite(proyecto) {
            const article = document.createElement('article');
            article.className = 'tarjeta-mini-app';
            article.innerHTML = `
                <div class="header-mini-app">
                    <h3>${proyecto.nombre}</h3>
                    <span class="sub-tag">Vista satélite</span>
                </div>
                <div class="contenedor-codigo-satelite">
                    <iframe class="iframe-satelite" src="${proyecto.ruta}" title="${proyecto.nombre}"></iframe>
                </div>
                <div class="acciones-satelite">
                    <button type="button" data-action="principal">Usar como principal</button>
                    <button type="button" data-action="abrir">Abrir en pestaña nueva</button>
                </div>
            `;

            article.querySelector('[data-action="principal"]').addEventListener('click', () => {
                proyectoPrincipalId = proyecto.id;
                actualizarVistaPrincipal();
            });

            article.querySelector('[data-action="abrir"]').addEventListener('click', () => {
                window.open(proyecto.ruta, '_blank', 'noopener,noreferrer');
            });

            return article;
        }

        function renderSatelites() {
            gridSatelites.innerHTML = '';
            const todosLosSatelites = proyectos.filter((p) => p.id !== proyectoPrincipalId);
            const satelites = todosLosSatelites.slice(0, 4);
            satelites.forEach((proyecto) => {
                gridSatelites.appendChild(crearTarjetaSatelite(proyecto));
            });
            const ocultos = todosLosSatelites.length - satelites.length;
            const nota = document.getElementById('nota-satelites');
            nota.textContent = ocultos > 0
                ? `Se muestran 4 proyectos satélite. Hay ${ocultos} proyecto(s) adicional(es) registrado(s).`
                : '';
        }

        function actualizarVistaPrincipal() {
            const principal = proyectos.find((p) => p.id === proyectoPrincipalId) || proyectos[0];
            selector.value = principal.id;
            iframePrincipal.src = principal.ruta;
            enlacePrincipal.href = principal.ruta;
            renderSatelites();
        }

        selector.addEventListener('change', (event) => {
            proyectoPrincipalId = event.target.value;
            actualizarVistaPrincipal();
        });

        renderSelector();
        actualizarVistaPrincipal();
    </script>
</body>
</html>
