<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App 2 · Propiedades & Exergía</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body{ font-family:'Inter',system-ui,sans-serif; }
  ::-webkit-scrollbar{ width:7px;height:7px; }
  ::-webkit-scrollbar-thumb{ background:#cbd5e1;border-radius:4px; }
  input[type=range]{ accent-color:#2563eb; }
  .glass{ background:rgba(255,255,255,.85); backdrop-filter:blur(6px); }
</style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-slate-200 text-slate-800 min-h-screen">

<div class="p-3 sm:p-4 max-w-[1500px] mx-auto">
  <header class="flex items-center gap-3 mb-3">
    <div class="text-3xl">⚗️</div>
    <div>
      <h1 class="text-lg sm:text-xl font-extrabold text-slate-900 leading-tight">Propiedades & Exergía</h1>
      <p class="text-xs text-slate-500">Asigna un fluido real y una presión a cada componente; mira cómo cambian Cp y la exergía mecánica recuperable.</p>
    </div>
  </header>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
    <section id="cards" class="flex flex-col gap-3"></section>
    <section class="flex flex-col gap-3">
      <div class="glass rounded-xl border border-slate-200 p-3">
        <h3 class="text-sm font-bold text-slate-700 mb-1">Calor específico Cp(T) · J/kg·K</h3>
        <div class="relative h-44 sm:h-52"><canvas id="ch-cp"></canvas></div>
      </div>
      <div class="glass rounded-xl border border-slate-200 p-3">
        <h3 class="text-sm font-bold text-slate-700 mb-1">Exergía mecánica disponible (ExPAnD) · kJ</h3>
        <p class="text-[11px] text-slate-400 mb-1">Trabajo recuperable por la presión del gas: eᴾ = R·T₀·ln(P/P₀)</p>
        <div class="relative h-40 sm:h-48"><canvas id="ch-ex"></canvas></div>
      </div>
      <div id="summary" class="glass rounded-xl border border-slate-200 p-3 grid grid-cols-2 gap-2"></div>
    </section>
  </div>
</div>

<script src="core/bus.js"></script>
<script>
let app1 = null;
let configs = Thermal.defaultApp2Config();
let result = null, chCp = null, chEx = null;
const fluidLabel = { H2:'Hidrógeno (H₂)', water:'Agua', glycol:'Agua-glicol' };
const fluidEmoji = { H2:'🫧', water:'💧', glycol:'🧪' };

function buildCards(){
  const streams = (app1 && app1.streams) || Thermal.computeApp1().streams;
  const wrap = document.getElementById('cards');
  wrap.innerHTML = '';
  streams.forEach(s => {
    const c = configs[s.id];
    const card = document.createElement('div');
    card.className = 'glass rounded-xl border border-slate-200 p-3';
    card.style.borderLeft = `5px solid ${s.color}`;
    card.innerHTML = `
      <div class="flex items-center justify-between mb-2">
        <h4 class="font-bold text-slate-800 flex items-center gap-2"><span class="text-xl">${s.icon}</span>${s.name}</h4>
        <span class="text-xs font-mono bg-slate-100 px-2 py-0.5 rounded">${fluidEmoji[c.fluid]} ${fluidLabel[c.fluid]}</span>
      </div>
      <div class="space-y-2 text-xs">
        <label class="block">Fluido real
          <select data-id="${s.id}" data-f="fluid" class="w-full mt-0.5 border border-slate-300 rounded px-1.5 py-1">
            <option value="H2" ${c.fluid==='H2'?'selected':''}>Hidrógeno (H₂)</option>
            <option value="water" ${c.fluid==='water'?'selected':''}>Agua líquida</option>
            <option value="glycol" ${c.fluid==='glycol'?'selected':''}>Agua-glicol</option>
          </select>
        </label>
        <label class="block">Presión <b data-d="P-${s.id}" class="float-right text-blue-600">${c.P_bar} bar</b>
          <input type="range" data-id="${s.id}" data-f="P_bar" min="1" max="900" step="1" value="${c.P_bar}" class="w-full">
        </label>
      </div>`;
    wrap.appendChild(card);
  });
  wrap.querySelectorAll('input,select').forEach(el => {
    el.addEventListener('input', () => {
      const id = el.dataset.id, f = el.dataset.f;
      configs[id][f] = (f === 'fluid') ? el.value : parseFloat(el.value);
      if (f === 'P_bar') document.querySelector(`[data-d="P-${id}"]`).textContent = el.value + ' bar';
      if (f === 'fluid') buildCards();
      recompute();
    });
  });
}

function baseOpts(yLabel){
  return {
    responsive:true, maintainAspectRatio:false, animation:false,
    interaction:{ mode:'index', intersect:false },
    plugins:{ legend:{ position:'top', labels:{ usePointStyle:true, boxWidth:7, font:{size:10} } } },
    scales:{
      x:{ title:{ display:true, text:'Tiempo (s)', font:{size:10} }, ticks:{ maxTicksLimit:8, font:{size:9} }, grid:{ color:'#eef2f7' } },
      y:{ title:{ display:true, text:yLabel, font:{size:10} }, ticks:{ font:{size:9} }, grid:{ color:'#eef2f7' }, beginAtZero:false }
    }
  };
}
function initCharts(){
  chCp = new Chart(document.getElementById('ch-cp'), { type:'line', data:{labels:[],datasets:[]}, options:baseOpts('J/kg·K') });
  chEx = new Chart(document.getElementById('ch-ex'), { type:'line', data:{labels:[],datasets:[]}, options:baseOpts('kJ') });
}
function updateCharts(){
  const labels = (app1 && app1.time) || result.streams[0].Cp.map((_,i)=>i);
  chCp.data.labels = labels;
  chCp.data.datasets = result.streams.map(s => ({
    label:`${s.name} (${fluidLabel[s.fluid]})`, data:s.Cp, borderColor:s.color, borderWidth:2, pointRadius:0, tension:.25
  }));
  chCp.update();
  chEx.data.labels = labels;
  chEx.data.datasets = result.streams.map(s => ({
    label:s.name, data:s.Ex_P, borderColor:s.color, backgroundColor:s.color+'22', borderWidth:2, pointRadius:0, tension:.2, fill:true
  }));
  chEx.update();
}
function updateSummary(){
  const el = document.getElementById('summary');
  el.innerHTML = result.streams.map(s => `
    <div class="rounded-lg p-2 border" style="border-color:${s.color}33;background:${s.color}0d">
      <div class="text-xs font-bold flex items-center gap-1">${s.icon} ${s.name}</div>
      <div class="text-[11px] text-slate-500 mt-1">Cp medio</div>
      <div class="text-sm font-bold" style="color:${s.color}">${Thermal.fmt(s.Cp_mean,0)} J/kg·K</div>
      <div class="text-[11px] text-slate-500 mt-1">Exergía pico</div>
      <div class="text-sm font-bold" style="color:${s.color}">${Thermal.fmt(s.Ex_total,0)} kJ</div>
    </div>`).join('');
}

function recompute(){
  result = Thermal.computeApp2(app1 || Thermal.computeApp1(), configs);
  updateCharts(); updateSummary();
  Thermal.publish(result);
}

let lastSig = null;
function ensureBuilt(){ if (window.__built) return; window.__built = true; buildCards(); }

initCharts();
Thermal.initApp('app2', (state) => {
  app1 = state.app1 || Thermal.computeApp1();
  // hidratar config guardada (una vez)
  if (state.app2 && state.app2.streams && !window.__hyd){
    window.__hyd = true;
    state.app2.streams.forEach(ss => { if (configs[ss.id]) { configs[ss.id].fluid = ss.fluid; configs[ss.id].P_bar = ss.P_bar; } });
  }
  // solo recalcular cuando cambian de verdad los datos de App1 (evita bucle de eco)
  const sig = JSON.stringify(app1.streams.map(s => s.T)) + app1.K;
  if (sig !== lastSig){ lastSig = sig; ensureBuilt(); recompute(); }
  else ensureBuilt();
});
</script>
</body>
</html>
