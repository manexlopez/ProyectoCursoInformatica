<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App 4 · Seguridad & Límites</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#1d2533; --muted:#6f7889; --line:#e4e7ee; --accent:#2a3647; --bronze:#b08d57; }
  body{ font-family:'Inter',system-ui,sans-serif; background:#eef0f4; color:var(--ink); }
  h1,h2,h3,h4{ font-family:'Cormorant Garamond',serif; }
  ::-webkit-scrollbar{ width:8px;height:8px; }
  ::-webkit-scrollbar-thumb{ background:#cdd3dd;border-radius:4px; }
  input[type=range]{ accent-color:var(--accent); }
  .glass{ background:#fff !important; border-color:var(--line) !important; backdrop-filter:none; }
  .eyebrow{ font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--bronze); font-weight:600; }
  @keyframes pulse2 { 0%,100%{ opacity:1 } 50%{ opacity:.4 } }
  .crit{ animation:pulse2 1.1s infinite; }
</style>
</head>
<body class="min-h-screen">

<div class="p-4 sm:p-6 max-w-[1500px] mx-auto">
  <header class="mb-4 pb-3 border-b" style="border-color:var(--line)">
    <div class="eyebrow">Módulo 4 — Operación segura</div>
    <h1 class="text-3xl sm:text-4xl font-semibold leading-tight">Seguridad y Límites</h1>
    <p class="text-sm text-[color:var(--muted)] mt-1">¿Cuánto tiempo falta para que cada componente choque con un límite térmico crítico?</p>
  </header>

  <!-- límites globales -->
  <div class="glass rounded-xl border p-3 mb-4 grid grid-cols-1 sm:grid-cols-3 gap-4 text-sm">
    <label class="block">T máx crítica <b id="d-tmax" class="float-right" style="color:#b3492c">85°C</b>
      <input id="tmax" type="range" min="50" max="150" step="1" value="85" class="w-full">
    </label>
    <label class="block">T mín crítica <b id="d-tmin" class="float-right" style="color:#3a6ea5">-40°C</b>
      <input id="tmin" type="range" min="-60" max="20" step="1" value="-40" class="w-full">
    </label>
    <label class="block">Bloque de control <b id="d-hold" class="float-right" style="color:var(--accent)">10 s</b>
      <input id="hold" type="range" min="2" max="20" step="1" value="10" class="w-full">
    </label>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
    <!-- gauges -->
    <section id="gauges" class="grid grid-cols-2 gap-3"></section>

    <!-- chart -->
    <section class="glass rounded-xl border border-slate-200 p-3">
      <h3 class="text-sm font-bold text-slate-700 mb-1">Temperatura continua vs discretizada por bloques</h3>
      <p class="text-[11px] text-slate-400 mb-1">La red no conmuta al instante: opera en bloques de duración fija. Líneas rojas/azules = límites.</p>
      <div class="relative h-64 sm:h-80"><canvas id="ch-disc"></canvas></div>
    </section>
  </div>
</div>

<script src="core/bus.js"></script>
<script>
let app1 = null;
let cfg = Thermal.defaultApp4Config();
let result = null, chDisc = null;

function statusInfo(st){
  if (st === 'critico') return ['bg-red-50 border-red-300','text-red-600','CRÍTICO','crit'];
  if (st === 'atencion') return ['bg-amber-50 border-amber-300','text-amber-600','ATENCIÓN',''];
  return ['bg-green-50 border-green-300','text-green-600','SEGURO',''];
}

function gauge(r){
  const ttl = r.ttl_min;
  const cap = 200;
  const frac = isFinite(ttl) ? Math.max(0, Math.min(1, ttl/cap)) : 1;
  const ang = Math.PI * (1 - frac); // semicirculo: 0=peligro(izq rojo)...
  const cx=60, cy=58, rr=46;
  const x = cx + rr*Math.cos(ang), y = cy - rr*Math.sin(ang);
  const [bg, txt, label, anim] = statusInfo(r.status);
  const col = r.status==='critico' ? '#dc2626' : r.status==='atencion' ? '#d97706' : '#16a34a';
  const ttlTxt = isFinite(ttl) ? ttl.toFixed(0)+' s' : '∞';
  return `
    <div class="glass rounded-xl border p-3 ${bg} ${anim}">
      <div class="flex items-center gap-2 mb-1">
        <span style="color:${r.color}">${Thermal.glyphSVG(r.id,17,r.color)}</span>
        <span class="text-xs font-semibold text-slate-700 truncate">${(Thermal.stationById(r.id)||{}).short||r.name}</span>
      </div>
      <svg viewBox="0 0 120 70" class="w-full">
        <path d="M14,58 A46,46 0 0,1 106,58" fill="none" stroke="#e2e8f0" stroke-width="9" stroke-linecap="round"/>
        <path d="M14,58 A46,46 0 0,1 106,58" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round"
              stroke-dasharray="${(Math.PI*rr).toFixed(1)}" stroke-dashoffset="${(Math.PI*rr*(1-frac)).toFixed(1)}"/>
        <line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#334155" stroke-width="2.5"/>
        <circle cx="${cx}" cy="${cy}" r="3.5" fill="#334155"/>
      </svg>
      <div class="text-center -mt-1">
        <div class="text-lg font-extrabold ${txt}">${ttlTxt}</div>
        <div class="text-[10px] font-bold ${txt}">${label}</div>
      </div>
    </div>`;
}

function buildGauges(){
  if (!result) return;
  document.getElementById('gauges').innerHTML = result.streams.map(gauge).join('');
}

function initChart(){
  chDisc = new Chart(document.getElementById('ch-disc'), {
    type:'line', data:{labels:[],datasets:[]},
    options:{ responsive:true, maintainAspectRatio:false, animation:false, interaction:{mode:'index',intersect:false},
      plugins:{ legend:{ labels:{ usePointStyle:true, boxWidth:7, font:{size:10} } } },
      scales:{ x:{ title:{display:true,text:'Tiempo (s)',font:{size:10}}, ticks:{maxTicksLimit:8,font:{size:9}} },
               y:{ title:{display:true,text:'°C',font:{size:10}}, ticks:{font:{size:9}} } } }
  });
}
function updateChart(){
  const labels = (app1 && app1.time) || result.streams[0].stepped.map((_,i)=>i);
  const ds = [];
  result.streams.forEach(s => {
    const orig = (app1 && app1.streams.find(a=>a.id===s.id)) || null;
    if (orig){
      ds.push({ label:s.name, data:orig.T, borderColor:s.color, borderWidth:1.4, borderDash:[4,4], pointRadius:0, tension:.3 });
    }
    ds.push({ label:s.name+' (bloques)', data:s.stepped, borderColor:s.color, borderWidth:2.4, pointRadius:0, stepped:'middle' });
  });
  // líneas de límite
  ds.push({ label:'T máx', data:labels.map(()=>cfg.T_max), borderColor:'#ef4444', borderWidth:1.2, borderDash:[2,3], pointRadius:0 });
  ds.push({ label:'T mín', data:labels.map(()=>cfg.T_min), borderColor:'#3b82f6', borderWidth:1.2, borderDash:[2,3], pointRadius:0 });
  chDisc.data.labels = labels;
  chDisc.data.datasets = ds;
  chDisc.update();
}

function recompute(){
  result = Thermal.computeApp4(app1 || Thermal.computeApp1(), cfg);
  buildGauges(); updateChart();
  Thermal.publish(result);
}

['tmax','tmin','hold'].forEach(id => {
  document.getElementById(id).addEventListener('input', e => {
    const v = +e.target.value;
    if (id==='tmax'){ cfg.T_max=v; document.getElementById('d-tmax').textContent=v+'°C'; }
    if (id==='tmin'){ cfg.T_min=v; document.getElementById('d-tmin').textContent=v+'°C'; }
    if (id==='hold'){ cfg.hold=v; document.getElementById('d-hold').textContent=v+' s'; }
    recompute();
  });
});

let lastSig = null;
initChart();
Thermal.initApp('app4', (state) => {
  app1 = state.app1 || Thermal.computeApp1();
  if (state.app4 && !window.__hyd){
    window.__hyd = true;
    if (state.app4.T_max!=null){ cfg.T_max=state.app4.T_max; document.getElementById('tmax').value=cfg.T_max; document.getElementById('d-tmax').textContent=cfg.T_max+'°C'; }
    if (state.app4.T_min!=null){ cfg.T_min=state.app4.T_min; document.getElementById('tmin').value=cfg.T_min; document.getElementById('d-tmin').textContent=cfg.T_min+'°C'; }
    if (state.app4.hold!=null){ cfg.hold=state.app4.hold; document.getElementById('hold').value=cfg.hold; document.getElementById('d-hold').textContent=cfg.hold+' s'; }
  }
  const sig = JSON.stringify(app1.streams.map(s => s.T)) + app1.K;
  if (sig !== lastSig){ lastSig = sig; recompute(); }
});
</script>
</body>
</html>
